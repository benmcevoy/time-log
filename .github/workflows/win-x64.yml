name: Build Windows AOT

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish -r win-x64 -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: wikd-win-x64
          path: out/
